name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.14.14

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # The suite is self-contained: in-memory SQLite, a temporary data
      # directory, and no network. It must stay that way.
      - run: pytest -q

      # The MCP Registry validates on publish, which is after the image is built
      # and the tag exists. Catch it here instead.
      - run: python -m scripts.validate_server_json

  migrations:
    name: alembic upgrade head
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: emailserver
          POSTGRES_USER: emailserver
          POSTGRES_PASSWORD: emailserver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emailserver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EMAILSERVER_DATABASE_URL: postgresql://emailserver:emailserver@localhost:5432/emailserver
      EMAILSERVER_DATA_DIR: /tmp/emailserver-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt
      - run: mkdir -p "$EMAILSERVER_DATA_DIR"

      # Stop before the backfill so rows can be seeded into the pre-migration
      # shape; an empty database would short-circuit it and prove nothing.
      - name: Apply migrations up to the placements table
        run: |
          python - <<'PY'
          from pathlib import Path

          from alembic import command
          from alembic.config import Config

          from src.config import settings

          config = Config("alembic.ini")
          config.set_main_option("script_location", str(Path("alembic").resolve()))
          config.set_main_option("sqlalchemy.url", settings.database_url.replace("%", "%%"))
          command.upgrade(config, "20260731_09")
          PY

      # Seed the exact shape the backfills exist for: one message filed in two
      # folders, which the old identity scheme stored as two unrelated rows, plus
      # one message per provider flag encoding. Raw SQL on purpose — the ORM model
      # already carries columns that this revision has not added yet.
      - name: Seed rows so the backfill path is exercised
        run: |
          python - <<'PY'
          from sqlalchemy import text

          from src.database.connection import SessionLocal
          from src.models.smtp_config import SMTPConfig
          from src.models.user import User

          with SessionLocal() as db:
              db.add(User(google_sub="ci", email="ci@example.invalid"))
              db.flush()
              account = SMTPConfig(
                  owner_user_id=1, provider="imap", auth_type="password", name="ci",
                  account_name="ci@example.invalid", host="imap.example.invalid", port=993,
                  smtp_host="smtp.example.invalid", smtp_port=465, username="ci",
              )
              db.add(account)
              db.flush()
              insert = text(
                  # content_state is NOT NULL with a Python-side ORM default, so
                  # raw SQL has to supply it. Every other NOT NULL column is named
                  # here for the same reason.
                  "INSERT INTO email_logs (smtp_config_id, sender, recipient, subject,"
                  " message_id, provider_message_id, folder, imap_uid, uid_validity,"
                  " flags, content_state)"
                  " VALUES (:account, 'a@example.invalid', 'b@example.invalid', 'ci',"
                  " :message_id, :provider_message_id, :folder, :uid, 1, :flags,"
                  " 'complete')"
              )
              rows = [
                  ("<ci@example.invalid>", "INBOX:1:1", "INBOX", 1, None),
                  ("<ci@example.invalid>", "INBOX.Sent:1:2", "INBOX.Sent", 2, None),
                  ("<imap@example.invalid>", "INBOX:1:3", "INBOX", 3, r"\Answered \Seen"),
                  ("<gmail@example.invalid>", "INBOX:1:4", "INBOX", 4, '["INBOX", "UNREAD"]'),
              ]
              for message_id, provider_message_id, folder, uid, flags in rows:
                  db.execute(insert, {
                      "account": account.id, "message_id": message_id,
                      "provider_message_id": provider_message_id, "folder": folder,
                      "uid": uid, "flags": flags,
                  })
              db.commit()
          PY

      # Exercise the same entry point the server uses on startup, so a broken
      # revision fails here rather than on a production deployment.
      - name: Apply the backfill
        run: python -c "from src.database.connection import init_database; init_database()"

      - name: Re-apply migrations (must be idempotent)
        run: python -c "from src.database.connection import init_database; init_database()"

      - name: The two rows must have merged into one message in two folders
        run: |
          python - <<'PY'
          from src.database.connection import SessionLocal
          from src.models.email import EmailLog
          from src.models.placement import MessagePlacement

          with SessionLocal() as db:
              messages = db.query(EmailLog).count()
              placements = db.query(MessagePlacement).count()
              assert messages == 3, f"merge did not collapse the duplicate: {messages} rows"
              assert placements == 4, f"every placement should survive: {placements}"
          print("backfill verified")
          PY

      - name: Provider flags must have normalised to the same tri-state
        run: |
          python - <<'PY'
          from src.database.connection import SessionLocal
          from src.models.email import EmailLog

          with SessionLocal() as db:
              by_id = {row.message_id: row for row in db.query(EmailLog).all()}
              imap = by_id["<imap@example.invalid>"]
              gmail = by_id["<gmail@example.invalid>"]
              merged = by_id["<ci@example.invalid>"]

              assert (imap.is_unread, imap.is_answered) == (False, True), vars(imap)
              # Gmail inverts the polarity and publishes no answered label.
              assert (gmail.is_unread, gmail.is_answered) == (True, None), vars(gmail)
              # Never observed is not the same as read.
              assert merged.is_unread is None, vars(merged)
          print("flag state verified")
          PY

      # The one failure mode that is silent in production: if the query expression
      # and the index expression drift apart, every search still returns the right
      # answer, by sequentially scanning every stored message body. Four rows would
      # always seq-scan on cost, so force the planner's hand.
      - name: The index expression must match what search builds
        run: |
          python - <<'PY'
          from sqlalchemy import text

          from src.database.connection import SessionLocal
          from src.services.search_text import index_name, text_search_configs

          expected = index_name("ix_email_logs_search_fts", text_search_configs())
          with SessionLocal() as db:
              indexes = {row[0] for row in db.execute(text(
                  "SELECT indexname FROM pg_indexes WHERE tablename = 'email_logs'"
              ))}
              assert expected in indexes, f"{expected} was not created: {sorted(indexes)}"
              db.execute(text("SET enable_seqscan = off"))
              plan = "\n".join(
                  row[0]
                  for row in db.execute(text(
                      "EXPLAIN SELECT id FROM email_logs WHERE"
                      " (to_tsvector('simple', coalesce(sender, '') || ' ' || coalesce(recipient, '')"
                      "  || ' ' || coalesce(subject, '') || ' ' || coalesce(body_plain, ''))"
                      " || to_tsvector('english', coalesce(sender, '') || ' ' || coalesce(recipient, '')"
                      "  || ' ' || coalesce(subject, '') || ' ' || coalesce(body_plain, ''))"
                      " || to_tsvector('german', coalesce(sender, '') || ' ' || coalesce(recipient, '')"
                      "  || ' ' || coalesce(subject, '') || ' ' || coalesce(body_plain, '')))"
                      " @@ (websearch_to_tsquery('simple', 'invoices')"
                      " || websearch_to_tsquery('english', 'invoices')"
                      " || websearch_to_tsquery('german', 'invoices'))"
                  ))
              )
          assert expected in plan, f"the planner ignored {expected}:\n{plan}"
          print("index expression verified")
          PY

      # What SQLite cannot show: PostgreSQL enforcing every foreign key while an
      # account and everything indexed from it goes -- on the migrated schema,
      # not one create_all built from the models. Runs last: it deletes the seed.
      - name: Deleting an account removes its index and keeps its send audit
        run: |
          python - <<'PY'
          import json

          from sqlalchemy import inspect

          from src.database.connection import SessionLocal, engine
          from src.models.attachment import EmailAttachment
          from src.models.email import EmailLog
          from src.models.placement import MessagePlacement
          from src.models.send_audit import SendAudit
          from src.models.smtp_config import SMTPConfig
          from src.models.sync_cursor import MailSyncCursor
          from src.services.account_deletion import delete_mail_account

          inspector = inspect(engine)
          column = next(c for c in inspector.get_columns("send_audits") if c["name"] == "smtp_config_id")
          reference = next(
              f for f in inspector.get_foreign_keys("send_audits") if f["constrained_columns"] == ["smtp_config_id"]
          )
          assert column["nullable"], column
          assert reference["options"].get("ondelete") == "SET NULL", reference
          # Without it, every deleted message scans the whole attachment table.
          indexes = {index["name"] for index in inspector.get_indexes("email_attachments")}
          assert "ix_email_attachments_email_log_id" in indexes, indexes

          with SessionLocal() as db:
              account = db.query(SMTPConfig).filter(SMTPConfig.name == "ci").one()
              replied = db.query(EmailLog).filter(EmailLog.smtp_config_id == account.id).first()
              db.add_all([
                  EmailAttachment(email_log_id=replied.id, filename="ci.txt", size=1, extraction_state="complete"),
                  MailSyncCursor(smtp_config_id=account.id, folder="INBOX", uid_validity=1, last_uid=4),
                  SendAudit(
                      owner_user_id=account.owner_user_id, smtp_config_id=account.id,
                      reply_to_email_id=replied.id, idempotency_key="ci-sent",
                      recipients_json=json.dumps(["to@example.invalid"]), subject="ci",
                      request_hash="0" * 64, status="sent",
                  ),
              ])
              db.commit()
              owner, account_id = account.owner_user_id, account.id

          with SessionLocal() as db:
              result = delete_mail_account(db, owner, account_id=account_id, confirm_name="ci")
          assert result["deleted"] and result["removed"] == {"messages": 3, "attachments": 1}, result

          with SessionLocal() as db:
              assert db.get(SMTPConfig, account_id) is None
              assert db.query(EmailLog).count() == 0
              assert db.query(EmailAttachment).count() == 0
              assert db.query(MessagePlacement).count() == 0
              assert db.query(MailSyncCursor).count() == 0
              audit = db.query(SendAudit).one()
              assert (audit.smtp_config_id, audit.reply_to_email_id, audit.subject) == (None, None, "ci"), vars(audit)
          print("account deletion verified")
          PY

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
