# HTTPS deployment for one owner, authenticated by a static bearer token.
# No Google Cloud project is required.
#
#   EMAILSERVER_DOMAIN=mail.example.com
#   POSTGRES_PASSWORD=...        openssl rand -base64 32
#   EMAILSERVER_API_TOKEN=...    openssl rand -base64 32
#   CREDENTIAL_ENCRYPTION_KEY=...
#   SESSION_SECRET=...
#
#   docker compose -f docker-compose.single-user.yml up -d --build
#
# Connect an MCP client that can send a static header, for example Claude Code:
#   claude mcp add --transport http mail https://mail.example.com/mcp \
#     --header "Authorization: Bearer $EMAILSERVER_API_TOKEN"
#
# Claude.ai and ChatGPT web connectors negotiate OAuth and cannot send a static
# header. Use docker-compose.production.yml (auth_mode=google) for those.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emailserver
      POSTGRES_USER: emailserver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emailserver"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  email-server:
    # Published image by default; `docker compose build` still works and
    # `docker compose up --build` overrides it for local development.
    image: ${MAILINDEX_IMAGE:-ghcr.io/alexanderkrauck/mailindex-mcp:latest}
    build: .
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EMAILSERVER_DATABASE_URL: postgresql://emailserver:${POSTGRES_PASSWORD}@postgres:5432/emailserver
      EMAILSERVER_AUTH_MODE: single_user
      EMAILSERVER_SYNC_ACCOUNT_CONCURRENCY: ${EMAILSERVER_SYNC_ACCOUNT_CONCURRENCY:-2}
      EMAILSERVER_SYNC_JOB_TIMEOUT_SECONDS: ${EMAILSERVER_SYNC_JOB_TIMEOUT_SECONDS:-300}
      EMAILSERVER_SYNC_JOB_CLEANUP_SECONDS: ${EMAILSERVER_SYNC_JOB_CLEANUP_SECONDS:-5}
      EMAILSERVER_SYNC_WATCHDOG_TIMEOUT_SECONDS: ${EMAILSERVER_SYNC_WATCHDOG_TIMEOUT_SECONDS:-30}
      EMAILSERVER_SYNC_STALE_AFTER_SECONDS: ${EMAILSERVER_SYNC_STALE_AFTER_SECONDS:-900}
      EMAILSERVER_IMAP_COMMAND_TIMEOUT_SECONDS: ${EMAILSERVER_IMAP_COMMAND_TIMEOUT_SECONDS:-60}
      EMAILSERVER_IMAP_CLEANUP_TIMEOUT_SECONDS: ${EMAILSERVER_IMAP_CLEANUP_TIMEOUT_SECONDS:-5}
      EMAILSERVER_UPSTREAM_DELETE_POLICY: ${EMAILSERVER_UPSTREAM_DELETE_POLICY:-tombstone}
      EMAILSERVER_TOMBSTONE_GRACE_DAYS: ${EMAILSERVER_TOMBSTONE_GRACE_DAYS:-7}
      EMAILSERVER_API_TOKEN: ${EMAILSERVER_API_TOKEN:?Set EMAILSERVER_API_TOKEN}
      EMAILSERVER_PUBLIC_BASE_URL: https://${EMAILSERVER_DOMAIN}
      EMAILSERVER_CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY}
      EMAILSERVER_SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      # Optional: only needed to connect Gmail mailboxes by OAuth rather than
      # by app password. Unrelated to how you sign in to this server.
      EMAILSERVER_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      EMAILSERVER_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FASTMCP_HOME: /data/fastmcp
    volumes:
      - emaildata:/data
    expose:
      - "8000"
    restart: always

  caddy:
    image: caddy:2-alpine
    depends_on:
      - email-server
    environment:
      EMAILSERVER_DOMAIN: ${EMAILSERVER_DOMAIN:?Set EMAILSERVER_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: always

volumes:
  pgdata:
  emaildata:
  caddy_data:
  caddy_config:
