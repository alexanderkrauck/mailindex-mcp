services:
  postgres:
    image: postgres:16-alpine
    container_name: email-server-postgres
    environment:
      POSTGRES_DB: emailserver
      POSTGRES_USER: emailserver
      POSTGRES_PASSWORD: emailserver
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emailserver"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  email-server:
    # Published image by default; `docker compose build` still works and
    # `docker compose up --build` overrides it for local development.
    image: ${MAILINDEX_IMAGE:-ghcr.io/alexanderkrauck/mailindex-mcp:latest}
    build: .
    container_name: email-server
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8000"  # HTTP API - localhost only
      - "127.0.0.1:2525:2525"  # SMTP port - localhost only
    environment:
      - EMAILSERVER_DATABASE_URL=postgresql://emailserver:emailserver@postgres:5432/emailserver
      - EMAILSERVER_API_HOST=0.0.0.0
      - EMAILSERVER_API_PORT=8000
      - EMAILSERVER_LOG_LEVEL=INFO
      - EMAILSERVER_SYNC_ACCOUNT_CONCURRENCY=${EMAILSERVER_SYNC_ACCOUNT_CONCURRENCY:-2}
      - EMAILSERVER_SYNC_JOB_TIMEOUT_SECONDS=${EMAILSERVER_SYNC_JOB_TIMEOUT_SECONDS:-300}
      - EMAILSERVER_SYNC_JOB_CLEANUP_SECONDS=${EMAILSERVER_SYNC_JOB_CLEANUP_SECONDS:-5}
      - EMAILSERVER_SYNC_WATCHDOG_TIMEOUT_SECONDS=${EMAILSERVER_SYNC_WATCHDOG_TIMEOUT_SECONDS:-30}
      - EMAILSERVER_SYNC_STALE_AFTER_SECONDS=${EMAILSERVER_SYNC_STALE_AFTER_SECONDS:-900}
      - EMAILSERVER_IMAP_COMMAND_TIMEOUT_SECONDS=${EMAILSERVER_IMAP_COMMAND_TIMEOUT_SECONDS:-60}
      - EMAILSERVER_IMAP_CLEANUP_TIMEOUT_SECONDS=${EMAILSERVER_IMAP_CLEANUP_TIMEOUT_SECONDS:-5}
      # The reconciler tombstones; a message leaves search at once and is removed
      # physically after the grace period. hard_delete would let a single wrong
      # inference destroy mail irreversibly.
      - EMAILSERVER_UPSTREAM_DELETE_POLICY=${EMAILSERVER_UPSTREAM_DELETE_POLICY:-tombstone}
      - EMAILSERVER_TOMBSTONE_GRACE_DAYS=${EMAILSERVER_TOMBSTONE_GRACE_DAYS:-7}
      # Seconds between full folder censuses. Sync job deadlines and independent
      # workers bound failures without letting a slow account block all others.
      - EMAILSERVER_DELETION_RECONCILE_INTERVAL=${EMAILSERVER_DELETION_RECONCILE_INTERVAL:-300}
      - EMAILSERVER_AUTH_MODE=${EMAILSERVER_AUTH_MODE:-development}
      - EMAILSERVER_API_TOKEN=${EMAILSERVER_API_TOKEN:-}
      - EMAILSERVER_PUBLIC_BASE_URL=${EMAILSERVER_PUBLIC_BASE_URL:-http://localhost:8002}
      - EMAILSERVER_GOOGLE_CLIENT_ID=${EMAILSERVER_GOOGLE_CLIENT_ID:-}
      - EMAILSERVER_GOOGLE_CLIENT_SECRET=${EMAILSERVER_GOOGLE_CLIENT_SECRET:-}
      - EMAILSERVER_REGISTRATION_MODE=${EMAILSERVER_REGISTRATION_MODE:-allowlist}
      - EMAILSERVER_ALLOWED_GOOGLE_EMAILS=${EMAILSERVER_ALLOWED_GOOGLE_EMAILS:-[]}
      - EMAILSERVER_ALLOWED_GOOGLE_SUBJECTS=${EMAILSERVER_ALLOWED_GOOGLE_SUBJECTS:-[]}
      - EMAILSERVER_CLAIM_LEGACY_ACCOUNTS_ON_FIRST_LOGIN=${EMAILSERVER_CLAIM_LEGACY_ACCOUNTS_ON_FIRST_LOGIN:-false}
      - FASTMCP_HOME=/data/fastmcp
    volumes:
      - emaildata:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  pgdata:
    driver: local
  emaildata:
    driver: local
